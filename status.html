<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <title>حالة الاتصال - HUSSEIN-STAR</title>
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body translate="no">

    <div class="cyber-bg" aria-hidden="true">
        <div class="cyber-orb cyber-orb--1"></div>
        <div class="cyber-orb cyber-orb--2"></div>
        <div class="cyber-grid"></div>
    </div>

    <div class="container">
        <div class="screen">
            <div class="screen-content">
                
                <div class="brand-header" style="margin-top: 20px;">
                    <h1 class="nettitle">HUSSEIN-STAR</h1>
                    <p class="subtitle">تم تسجيل الدخول بنجاح</p>
                </div>

                <div class="login-box" style="padding: 20px 15px;">
                    <div class="login-title">
                        <span class="icon-ok-circled"></span>
                        <span>حالة الاتصال</span>
                    </div>

                    <div class="data">
                        <span>رقم الكرت :</span>
                        <span>$(username)</span>
                    </div>
                    
                    <div class="data">
                        <span>التحميل المتبقي :</span>
                        <span>$(bytes-out-nice)</span>
                    </div>

                    <div class="data">
                        <span>الوقت المتبقي :</span>
                        <span>$(session-time-left)</span>
                    </div>

                    <div class="data">
                        <span>متصل منذ :</span>
                        <span>$(uptime)</span>
                    </div>

                    <div class="data">
                        <span>الاستهلاك :</span>
                        <span>$(bytes-in-nice)</span>
                    </div>

                    <!-- أزرار التحكم -->
                    <div class="status-actions" style="margin-top: 20px;">
                        <a href="$(link-logout)" class="app-submit logout-submit" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <span class="icon-off"></span> تسجيل الخروج
                        </a>
                        <button type="button" class="app-submit service-submit" style="display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="window.location.href='https://wa.me/967738660998';">
                            <span class="icon-headphones"></span> الدعم
                        </button>
                    </div>
                    
                    <a href="$(link-status)" style="display: block; text-align: center; color: #00e5ff; margin-top: 15px; font-size: 13px; text-decoration: none;">تحديث البيانات</a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
